repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ruff and mypy run through `uv run` (not the hosted mirror hooks) so they use
  # the exact versions pinned in pyproject.toml/uv.lock, not a separately
  # managed pre-commit venv that can drift from the project's own pins.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # CI runs with UV_FROZEN=1, so a pyproject.toml edit that was never
      # locked fails there rather than here -- with an error about the
      # lockfile, several minutes after the commit that caused it. This is the
      # same check at the point where the fix is one command.
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # pre-push, not pre-commit: the full suite is worth blocking a push over,
      # but running it on every single commit is what gets --no-verify'd once
      # the suite grows.
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
